plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.example.attendance'
    compileSdk 34
    // RELEASE SIGNING. The private key is NOT in this repository. The GitHub build restores it from repository
    // secrets and passes it in through these environment variables (see README, "Signing key").
    // Every release must be signed with the SAME key, otherwise Android refuses to install it over the old app.
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    // The GitHub build passes its run number (-PverCode=N), so every build has a higher version than the last.
    def buildNumber = (project.findProperty('verCode') ?: '1').toString().toInteger()
    defaultConfig {
        applicationId "com.example.attendance"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }
    buildTypes {
        release {
            debuggable false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    // The old debug-only build never ran lint, so keep the release build the same: lint must not be able to fail it.
    lint { checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'   // pull down to refresh
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.work:work-runtime:2.9.1'                    // the attendance reminders in the notification bar
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'   // encrypted storage for the sign-in token
}
